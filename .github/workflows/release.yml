name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
  # prepare-release.yml calls this directly. A tag pushed with GITHUB_TOKEN
  # starts no other workflow, so the push trigger above never fires for it.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The binary takes its version from Cargo.toml. A tag that disagrees
      # would publish packages named for one version that hold another.
      - name: Compare the tag with Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lazyp4-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lazyp4.exe
          # The oldest runner, not ubuntu-latest: the binary links glibc
          # dynamically and needs at least the glibc it was built against.
          - name: lazyp4-linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: lazyp4
          - name: lazyp4-macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: lazyp4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache the P4API
        uses: actions/cache@v4
        with:
          path: .p4api
          key: p4api-${{ matrix.name }}-r25.1

      # No target cache here. A release is rare, and building OpenSSL from
      # source rather than restoring it is the more trustworthy of the two.
      #
      # The default shell, not bash: on Windows, Git Bash puts Git's own Perl
      # first on PATH, and that Perl lacks the modules OpenSSL's Configure
      # needs. pwsh finds the runner's Strawberry Perl, as in ci.yml.
      - name: Build
        env:
          P4API_CACHE_DIR: ${{ github.workspace }}/.p4api
        run: cargo build --release --target ${{ matrix.target }} -p lazyp4

      # The P4API, OpenSSL and — on Windows — the CRT are all linked
      # statically, so what comes out is one file with nothing beside it.
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          cp README.md LICENSE dist/ 2>/dev/null || cp README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.name }}.zip" ./*
          else
            tar -czf "../${{ matrix.name }}.tar.gz" ./*
          fi

      # The install scripts take the tarball; these are for people who would
      # rather have the package manager own the file.
      - name: Package .deb and .rpm
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NFPM_VERSION: 2.47.0
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" nfpm
          ./nfpm package --config packaging/nfpm.yaml --packager deb --target .
          ./nfpm package --config packaging/nfpm.yaml --packager rpm --target .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
            *.deb
            *.rpm
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The install scripts check their download against this file.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A draft, so that nothing reaches /releases/latest — and so the install
      # scripts — until someone has looked at it and published it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
